  .chat-status { display: flex; align-items: center; gap: 10px; }

  .status-text { font-size: 13px; color: var(--ink-soft); font-weight: 500; }
  .status-text strong { color: var(--ink); font-weight: 600; }
  .chat-time { font-family: 'Fraunces', serif; font-size: 12px; color: var(--ink-faint); font-style: italic; }

  .msg-user { background: var(--user-msg); color: var(--user-msg-text); border-bottom-right-radius: 4px; margin-left: auto; }
  .msg-meta { font-size: 10px; color: var(--ink-faint); margin-top: 6px; padding: 0 8px; letter-spacing: 0.05em; text-transform: uppercase; }

  .typing { display: flex; gap: 4px; padding: 16px 20px; background: var(--bot-msg); border-radius: 18px; border-bottom-left-radius: 4px; width: fit-content; box-shadow: var(--shadow-sm); border: 1px solid rgba(219,227,240,0.7); }

  .booking-card { background: linear-gradient(135deg, #ffffff 0%, #eef7f4 100%); border: 1px solid var(--line); border-radius: 16px; padding: 24px; margin-top: 12px; box-shadow: var(--shadow-md); animation: msgIn 0.5s cubic-bezier(0.2,0.8,0.2,1); max-width: 78%; }

  .booking-confirm { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; gap: 8px; }
  .btn-primary { flex: 1; background: var(--accent); color: white; border: none; padding: 11px 20px; border-radius: 8px; font-family: 'Geist', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .btn-primary:hover { background: var(--accent-dark); transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .btn-secondary { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); padding: 11px 20px; border-radius: 8px; font-family: 'Geist', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; }

  .input-area { padding: 20px 32px 24px; border-top: 1px solid var(--line); background: rgba(245,247,252,0.85); backdrop-filter: blur(12px); }

let lang = 'en';
const t = () => S[lang];

const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('user-input');
const memory = { name: null, issue: null, urgency: null, proposedTime: null, proposedKey: null, collecting: null };

function showBannerNote() { alert(t().bannerNote); }

function paintStatic() {
  const s = t();
  document.title = s.docTitle;
  document.documentElement.lang = lang;
  document.getElementById('banner-label').textContent = s.bannerLabel;
  document.getElementById('p-mark').textContent = s.mark;
  document.getElementById('p-name').textContent = s.name;
  document.getElementById('p-doctor').textContent = s.doctor;
  document.getElementById('p-promise-h').textContent = s.promiseH;
  document.getElementById('p-promise-p').textContent = s.promiseP;
  document.getElementById('l-area').textContent = s.lblArea;
  document.getElementById('v-area').textContent = s.valArea;
  document.getElementById('l-phone').textContent = s.lblPhone;
  document.getElementById('v-phone').textContent = s.valPhone;
  document.getElementById('l-care').textContent = s.lblCare;
  document.getElementById('v-care').textContent = s.valCare;
  document.getElementById('p-powered').innerHTML = s.powered;
  document.getElementById('status-text').innerHTML = s.statusText;
  inputEl.placeholder = s.placeholder;
  document.getElementById('input-hint').textContent = s.hint;
  const h = new Date().getHours();
  document.getElementById('chat-time').textContent = (h < 8 || h >= 17) ? s.timeLate : s.timeEarly;
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-es').classList.toggle('active', lang === 'es');
}

async function setLang(next) {
  if (next === lang) return;
  lang = next;
  paintStatic();
  // Retire stale chips from the previous language so only the live prompt is clickable.
  messagesEl.querySelectorAll('.chip').forEach(c => c.disabled = true);
  // Same conversation, new language — re-offer the last open question.
  await addBotMessage(t().switched, 600, memory.collecting ? null : mainChips());
}

function mainChips() {
  const c = t().chips;
  return [
    { label: c.emergency, value: 'emergency' },
    { label: c.estimate, value: 'estimate' },
    { label: c.insurance, value: 'insurance' },
    { label: c.message, value: 'message' }
  ];
}

function addBotMessage(text, delay = 700, chips = null) {
  return new Promise(res => {
    const id = 't' + Date.now() + Math.floor(Math.random() * 1000);
    const w = document.createElement('div'); w.className = 'msg-group'; w.id = id;
    w.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    messagesEl.appendChild(w); messagesEl.scrollTop = messagesEl.scrollHeight;
    setTimeout(() => {
      document.getElementById(id)?.remove();
      const g = document.createElement('div'); g.className = 'msg-group';
      let h = `<div class="msg msg-bot">${text}</div><div class="msg-meta">${t().botMeta}</div>`;
      if (chips) {
        h += '<div class="quick-replies">';
        chips.forEach(c => { h += `<button class="chip" onclick="handleChipClick('${c.value}',this)">${c.label}</button>`; });
        h += '</div>';
      }
      g.innerHTML = h; messagesEl.appendChild(g); messagesEl.scrollTop = messagesEl.scrollHeight; res();
    }, delay);
  });
}

function addUserMessage(text) {
  const g = document.createElement('div'); g.className = 'msg-group';
  g.innerHTML = `<div class="msg msg-user" style="margin-left:auto;">${text}</div><div class="msg-meta user">${t().userMeta}</div>`;
  messagesEl.appendChild(g); messagesEl.scrollTop = messagesEl.scrollHeight;
}

function disableChips(btn) {
  btn.parentElement.querySelectorAll('.chip').forEach(c => c.disabled = true);
  btn.style.background = 'var(--accent)'; btn.style.color = '#ffffff';
}

function scheduleChips() {
  const c = t().chips;
  return [
    { label: c['this-week'], value: 'this-week' },
    { label: c['next-week'], value: 'next-week' },
    { label: c.flexible, value: 'flexible' }
  ];
}

function showBookingCard(matterKey, timeKey) {
  const c = t().card;
  const matter = c.matters[matterKey] || c.matters.default;
  const time = c.times[timeKey] || timeKey;
  const g = document.createElement('div'); g.className = 'msg-group';
  g.innerHTML = `<div class="booking-card">
    <div class="booking-header"><div class="booking-icon">V</div><div class="booking-title">${c.title}</div></div>
    <div class="booking-detail"><span class="label">${c.patient}</span><span class="value">${memory.name || c.newPatient}</span></div>
    <div class="booking-detail"><span class="label">${c.reason}</span><span class="value">${matter}</span></div>
    <div class="booking-detail"><span class="label">${c.proposed}</span><span class="value">${time}</span></div>
    <div class="booking-detail"><span class="label">${c.withDr}</span><span class="value">${c.drVal}</span></div>
    <div class="booking-detail"><span class="label">${c.office}</span><span class="value">${c.officeVal}</span></div>
    <div class="booking-confirm">
      <button class="btn-primary" onclick="confirmBooking()">${c.confirm}</button>
      <button class="btn-secondary" onclick="proposeAlternative()">${c.different}</button>
    </div></div>`;
  messagesEl.appendChild(g); messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function startConversation() {
  await addBotMessage(t().greeting, 400, mainChips());
}

async function handleChipClick(value, btn) {
  disableChips(btn);
  addUserMessage(t().said[value] || value);
  await routeIntent(value);
}

async function routeIntent(value) {
  const s = t(), c = s.chips, r = s.r;
  if (value === 'emergency') {
    memory.issue = 'emergency';
    await addBotMessage(r.emergency, 1200, [
      { label: c['urgent-now'], value: 'urgent-now' },
      { label: c['urgent-soon'], value: 'urgent-soon' },
      { label: c['urgent-planning'], value: 'urgent-planning' }
    ]);
    return;
  }
  if (value === 'estimate') { memory.issue = 'estimate'; await addBotMessage(r.estimate, 1100, scheduleChips()); return; }
  if (value === 'insurance') {
    memory.issue = 'insurance';
    await addBotMessage(r.insurance, 1200, [
      { label: c['ins-have'], value: 'ins-have' },
      { label: c['ins-none'], value: 'ins-none' },
      { label: c['ins-cost'], value: 'ins-cost' }
    ]);
    return;
  }
  if (value === 'ins-have') { await addBotMessage(r.insHave, 1200, scheduleChips()); return; }
  if (value === 'ins-none') { await addBotMessage(r.insNone, 1200, scheduleChips()); return; }
  if (value === 'ins-cost') { await addBotMessage(r.insCost, 1200, scheduleChips()); return; }
  if (value === 'urgent-now') {
    memory.urgency = 'severe';
    await addBotMessage(r.urgentNow, 1100);
    memory.collecting = 'name-phone'; return;
  }
  if (value === 'urgent-soon' || value === 'urgent-planning') {
    memory.urgency = value;
    await addBotMessage(r.urgentSoon, 1000, scheduleChips()); return;
  }
  if (['this-week', 'next-week', 'flexible'].includes(value)) {
    memory.proposedKey = value;
    memory.proposedTime = s.card.times[value];
    await addBotMessage(r.hold(s.card.times[value]), 900);
    memory.collecting = 'name-for-booking'; return;
  }
  if (value === 'yes-hold') { memory.proposedKey = 'this-week'; memory.proposedTime = s.card.times['this-week']; await addBotMessage(r.hold(s.card.times['this-week']), 900); memory.collecting = 'name-for-booking'; return; }
  if (value === 'no-slot') { await addBotMessage(r.noSlot, 800); return; }
  if (value === 'message') { memory.issue = 'message'; await addBotMessage(r.message, 900); memory.collecting = 'free-question'; return; }
}

async function handleUserSend() {
  const text = inputEl.value.trim(); if (!text) return;
  addUserMessage(text); inputEl.value = '';
  const r = t().r;
  if (['name', 'name-for-booking', 'name-phone'].includes(memory.collecting)) {
    const n = text.split(/\s+/)[0].replace(/[^a-zA-ZÀ-ÿ]/g, '');
    memory.name = n.charAt(0).toUpperCase() + n.slice(1).toLowerCase();
    const fn = { 'name': r.askPhone, 'name-for-booking': r.askPhoneBooking, 'name-phone': r.askCallback }[memory.collecting];
    await addBotMessage(fn(memory.name), 800); memory.collecting = 'phone'; return;
  }
  if (memory.collecting === 'phone') {
    memory.phone = text; memory.collecting = null;
    if (memory.proposedKey) {
      await addBotMessage(r.holdIntro, 800);
      setTimeout(() => showBookingCard(memory.issue, memory.proposedKey), 1200);
    } else if (memory.urgency === 'severe') {
      await addBotMessage(r.severeDone(memory.name), 1100);
    } else {
      await addBotMessage(r.confirmSoon(memory.name, text), 1000);
    }
    return;
  }
  if (memory.collecting === 'free-question') {
    memory.collecting = null;
    await addBotMessage(r.logged, 1100, [
      { label: t().chips['yes-hold'], value: 'yes-hold' },
      { label: t().chips['no-slot'], value: 'no-slot' }
    ]);
    return;
  }
  await addBotMessage(r.fallback, 900, mainChips());
}

function confirmBooking() {
  const card = messagesEl.querySelector('.booking-card');
  if (card) {
    Object.assign(card.style, { transition: 'all 0.3s ease', background: 'linear-gradient(135deg,#1458d4 0%,#0b2a66 100%)', color: 'white' });
    card.querySelector('.booking-title').style.color = 'white';
    card.querySelector('.booking-icon').style.cssText = 'background:var(--accent-warm);color:#063329';
    card.querySelectorAll('.label').forEach(el => el.style.color = 'rgba(255,255,255,0.6)');
    card.querySelectorAll('.value').forEach(el => el.style.color = 'white');
    card.querySelector('.booking-confirm').remove();
  }
  setTimeout(() => addBotMessage(t().r.booked(memory.name), 700), 400);
}

function proposeAlternative() {
  const card = messagesEl.querySelector('.booking-card');
  if (card) card.remove();
  memory.proposedKey = null;
  const c = t().chips;
  addBotMessage(t().r.alt, 600, [
    { label: c.alt1, value: 'this-week' },
    { label: c.alt2, value: 'next-week' },
    { label: c.alt3, value: 'flexible' }
  ]);
}

inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') handleUserSend(); });
paintStatic();
setTimeout(startConversation, 600);
</script>
